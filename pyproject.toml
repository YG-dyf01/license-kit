[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "licensekit"
version = "1.0.0"
description = "卡密 + 设备绑定 + 签名令牌 的极简授权体系（Python 服务端 + Android 验签器）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "YG-dyf01" }]
keywords = ["licensing", "license-key", "activation", "ecdsa", "android"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security :: Cryptography",
    "Topic :: Software Development :: Libraries",
]
dependencies = ["cryptography>=41"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
lic = "licensekit.cli:main"
lic-server = "licensekit.server:main"

[project.urls]
Homepage = "https://github.com/YG-dyf01/license-kit"
Source = "https://github.com/YG-dyf01/license-kit"
Issues = "https://github.com/YG-dyf01/license-kit/issues"

[tool.setuptools.packages.find]
include = ["licensekit*"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]